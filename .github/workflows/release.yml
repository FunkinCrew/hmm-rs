# A version bump releases itself: a push of `main` whose Cargo.toml version has
# no `v<version>` tag yet runs the tests, builds every target, publishes to
# crates.io, and then creates the GitHub release, which creates that tag as the
# "published" marker. A failed run leaves no tag, so the next push or a re-run
# tries again (publish-crates skips a version already on crates.io). GitHub does
# not re-trigger this workflow for a tag its own token created. Pushing a
# `v<version>` tag by hand still works (refused on mismatch). workflow_dispatch
# builds and uploads the artifacts without publishing.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      # "true" when this run publishes: a matching tag push, or a push of main
      # whose version is not tagged yet.
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "tag $GITHUB_REF_NAME does not match the Cargo.toml version v$version" >&2
              exit 1
            fi
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "main" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "v$version is already tagged: nothing to release"
            else
              echo "v$version is not tagged yet: releasing"
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: check-version
    if: needs.check-version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: [check-version, test]
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Asset names are `hmm-rs-v<version>-<target>.<ext>`: `hmm-rs upgrade`
      # (self_update) finds its download by bin name + target triple.
      - name: Create archive (unix)
        if: matrix.archive == 'tar.gz'
        run: tar czf "hmm-rs-v$VERSION-${{ matrix.target }}.tar.gz" -C target/${{ matrix.target }}/release hmm-rs

      - name: Create archive (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../"hmm-rs-v$VERSION-${{ matrix.target }}.zip" hmm-rs.exe

      - uses: actions/upload-artifact@v6
        with:
          name: hmm-rs-${{ matrix.target }}
          path: hmm-rs-*.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: [check-version, test]
    if: needs.check-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Creating the release creates the `v<version>` tag at this commit when it
  # does not exist yet: the "published" marker for a version bump on main.
  release:
    name: GitHub Release
    needs: [check-version, build, publish]
    if: needs.check-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*

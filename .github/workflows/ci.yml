name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      # --include-ignored also runs the network-dependent tests (marked
      # #[ignore]) that are skipped in local offline runs.
      - run: cargo test -- --include-ignored
